services:
  activemq:
    image: apache/activemq-artemis:latest-alpine
    container_name: activemq
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ARTEMIS_EXTRA_ARGS: "--host 0.0.0.0 --allow-anonymous"
    ports:
      - "61616:61616" # JMS port
      - "8161:8161" # Web console port
    volumes:
      - activemq-data:/var/lib/artemis/data
    networks:
      - jms-network

  publisher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jms-publisher
    command: ./run_in_container.sh
    environment:
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USERNAME: artemis
      ACTIVEMQ_PASSWORD: artemis
      PUBLISHER_MODE: true
    volumes:
      - ./files:/app/files
    networks:
      - jms-network
    stdin_open: true # Keep STDIN open
    tty: true # Allocate a TTY
    depends_on:
      - activemq

  subscriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jms-subscriber
    command: ./run_in_container.sh
    environment:
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USERNAME: artemis
      ACTIVEMQ_PASSWORD: artemis
      SUBSCRIBER_MODE: true
    volumes:
      - ./files:/app/files
    networks:
      - jms-network
    stdin_open: true # Keep STDIN open
    tty: true # Allocate a TTY
    depends_on:
      - activemq

networks:
  jms-network:
    driver: bridge

volumes:
  activemq-data:
